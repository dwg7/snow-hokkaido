<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snow-hokkaido</title>
    <!-- Versions are pinned; confirm dist files exist with `curl -sI` before changing (a missing file gives a blank page). -->
    <!-- open the connections early: the first request to each host otherwise pays the connection setup (up to 2.5 s measured) -->
    <link rel="preconnect" href="https://data.source.coop" crossorigin />
    <link rel="preconnect" href="https://stars.optgeo.org" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.1/dist/espressoTheme.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./vendor/tabularmap/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="tm-dark">
    <script>
      // Over a CDN the search indexer's SharedWorker is blocked cross-origin; fall back to the synchronous path.
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.1/dist/openmct.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
    <div id="app"></div>
    <script src="./vendor/tabularmap/tabularmap.js"></script>
    <script src="./openmct-plugin.js"></script>
    <script src="./shell.js"></script>
    <script>
      (function () {
        const script = document.querySelector('script[src*="openmct.js"]');
        if (script) openmct.setAssetPath(script.src.replace(/openmct\.js(?:\?.*)?$/, ''));
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());
        openmct.install(SnowHokkaidoPlugin({ dataUrl: './data/', viewUrl: 'https://data.source.coop/smartmaps/foil4gr1/snow-hokkaido/view/' }));
        // Open MCT 4.3.1 reads the time system at start-up; without a selected one it logs a harmless TypeError (reading 'key')
        openmct.time.setTimeSystem('utc');
        openmct.time.setMode('fixed', { start: Date.now() - 24 * 60 * 60 * 1000, end: Date.now() });
        openmct.start('#app');
      })();
    </script>
  </body>
</html>
